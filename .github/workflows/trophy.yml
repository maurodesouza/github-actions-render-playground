name: Generate trophy card

on:
  schedule:
    - cron: "* */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Switch to output branch
        run: |
          git fetch origin output || true
          git checkout output || git checkout -b output

      - name: Generate trophy
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          theme: monokai
          username: maurodesouza
          file: trophies/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add trophies/trophy.svg
          git commit -m "update trophy" || echo "no changes"
          git push origin output
